# AMD Graphics Module
---
name: gfx-amd
description: >
  A module to install and configure AMD graphics support on the system.
  This includes necessary packages and drivers for AMD GPUs.

packages:
  - mesa
  - lib32-mesa
  - vulkan-radeon
  - lib32-vulkan-radeon
  - xf86-video-amdgpu
  - libva-mesa-driver
